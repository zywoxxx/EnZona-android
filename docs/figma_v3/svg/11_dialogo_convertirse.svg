33333337" y="848" width="56" height="32" rx="16" fill="#1F3A5F"/><g transform="translate(331.33333333333337 852) scale(1.0000)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#FFFFFF"/></g><text x="343.33333333333337" y="897" font-family="Roboto" font-size="12" font-weight="500" fill="#1F3A5F" text-anchor="middle">Perfil</text></g><rect x="156" y="905" width="100" height="4" rx="2" fill="#1B2432" id="Indicador de navegación"/><rect x="0" y="0" width="412" height="917" rx="0" fill="#000000" opacity="0.42" id="Scrim"/><rect x="56" y="282" width="300" height="400" rx="28" fill="#FFFFFF" id="Fondo del diálogo"/><text x="80" y="322" font-family="Roboto" font-size="20" font-weight="500" fill="#1B2432" text-anchor="start">¿Convertirte en</text><text x="80" y="348" font-family="Roboto" font-size="20" font-weight="500" fill="#1B2432" text-anchor="start">organizador?</text><text x="80" y="380" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">Al confirmar, en tu cuenta cambia esto:</text><text x="80" y="404" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">• Aparece la pestaña Mis eventos.</text><text x="80" y="427" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">• Podrás crear y publicar eventos gratuitos</text><text x="80" y="445" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">o de pago, definir aforo y asientos.</text><text x="80" y="470" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">• Podrás designar personal de acceso para</text><text x="80" y="488" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">tus eventos.</text><text x="80" y="513" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">• Conservas tu cuenta de asistente y podrás</text><text x="80" y="531" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">dejar de ser organizador más adelante.</text><g id="Botón · Sí, convertirme en organizador"><rect x="104" y="562" width="228" height="40" rx="20.0" fill="#F2643B"/><text x="218.0" y="587.0" font-family="Roboto" font-size="13" font-weight="500" fill="#1B2432" text-anchor="middle">Sí, convertirme en organizador</text></g><text x="332" y="640" font-family="Roboto" font-size="13.5" font-weight="500" fill="#1F3A5F" text-anchor="end">Cancelar</text></g></svg>