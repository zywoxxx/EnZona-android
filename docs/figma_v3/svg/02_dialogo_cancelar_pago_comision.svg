chor="start">Planta baja · Fila A · Asiento 6</text><text x="396" y="384" font-family="Roboto" font-size="12" font-weight="500" fill="#5D6D7E" text-anchor="end">Sin usar</text><text x="16" y="424" font-family="Roboto" font-size="13" font-weight="400" fill="#1B2432" text-anchor="start">EZ-9952-6215-8549</text><text x="16" y="440" font-family="Roboto" font-size="11" font-weight="400" fill="#5D6D7E" text-anchor="start">Planta baja · Fila A · Asiento 7</text><text x="396" y="424" font-family="Roboto" font-size="12" font-weight="500" fill="#5D6D7E" text-anchor="end">Sin usar</text><rect x="16" y="476" width="380" height="300" rx="20" fill="#FFFFFF"/><g transform="translate(32 494) scale(0.9167)"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#D64E2A"/></g><text x="62" y="511" font-family="Roboto" font-size="16" font-weight="500" fill="#1B2432" text-anchor="start">Personal de acceso</text><text x="32" y="536" font-family="Roboto" font-size="13" font-weight="400" fill="#5D6D7E" text-anchor="start">Quien designes podrá escanear los códigos QR en la</text><text x="32" y="554" font-family="Roboto" font-size="13" font-weight="400" fill="#5D6D7E" text-anchor="start">puerta desde su propia cuenta.</text><g id="Campo · Correo de la persona"><rect x="32" y="578" width="348" height="52" rx="12" fill="#FFFFFF" stroke="#9AA6B6" stroke-width="1"/><text x="48" y="610.0" font-family="Roboto" font-size="16" font-weight="400" fill="#5D6D7E" text-anchor="start">Correo de la persona</text></g><g id="Botón · Designar como validador"><rect x="32" y="644" width="348" height="44" rx="22.0" fill="#D7E1EE"/><text x="206.0" y="671.0" font-family="Roboto" font-size="15" font-weight="500" fill="#1F3A5F" text-anchor="middle">Designar como validador</text></g><text x="32" y="712" font-family="Roboto" font-size="12" font-weight="500" fill="#5D6D7E" text-anchor="start">Designados</text><text x="32" y="736" font-family="Roboto" font-size="14" font-weight="400" fill="#1B2432" text-anchor="start">Luis Puerta</text><text x="32" y="752" font-family="Roboto" font-size="12" font-weight="400" fill="#5D6D7E" text-anchor="start">validador@uv.mx</text><text x="380" y="738" font-family="Roboto" font-size="12" font-weight="500" fill="#D64E2A" text-anchor="end">Quitar</text><g id="Botón · Cancelar evento"><rect x="16" y="792" width="380" height="48" rx="24.0" fill="#FFFFFF" stroke="#D9DFEA" stroke-width="1"/><text x="206.0" y="821.0" font-family="Roboto" font-size="15" font-weight="500" fill="#D64E2A" text-anchor="middle">Cancelar evento</text></g><rect x="156" y="905" width="100" height="4" rx="2" fill="#1B2432" id="Indicador de navegación"/><rect x="0" y="0" width="412" height="917" rx="0" fill="#000000" opacity="0.42" id="Scrim"/><rect x="60" y="220" width="292" height="480" rx="28" fill="#FFFFFF" id="Fondo del diálogo"/><text x="84" y="262" font-family="Roboto" font-size="22" font-weight="500" fill="#1B2432" text-anchor="start">¿Cancelar el evento?</text><text x="84" y="296" font-family="Roboto" font-size="15" font-weight="500" fill="#5D6D7E" text-anchor="start">Concierto: Orquesta Universitaria</text><text x="84" y="324" font-family="Roboto" font-size="13.5" font-weight="400" fill="#1B2432" text-anchor="start">Se reembolsarán $360.00 MXN a 3</text><text x="84" y="343" font-family="Roboto" font-size="13.5" font-weight="400" fill="#1B2432" text-anchor="start">asistentes. Se aplicará una comisión</text><text x="84" y="362" font-family="Roboto" font-size="13.5" font-weight="400" fill="#1B2432" text-anchor="start">de cancelación del 10 % ($36.00 MXN)</text><text x="84" y="381" font-family="Roboto" font-size="13.5" font-weight="400" fill="#1B2432" text-anchor="start">a tu cuenta.</text><rect x="84" y="402" width="244" height="140" rx="12" fill="#FBF0D5"/><g transform="translate(96 412) scale(0.8333)"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" fill="#1F3A5F"/></g><text x="124" y="426" font-family="Roboto" font-size="13.5" font-weight="500" fill="#1F3A5F" text-anchor="start">Comisión de cancelación:</text><text x="124" y="444" font-family="Roboto" font-size="13.5" font-weight="500" fill="#1F3A5F" text-anchor="start">$36.00 MXN</text><text x="124" y="462" font-family="Roboto" font-size="12.5" font-weight="400" fill="#1F3A5F" text-anchor="start">Es el 10 % de $360.00 MXN</text><text x="124" y="479" font-family="Roboto" font-size="12.5" font-weight="400" fill="#1F3A5F" text-anchor="start">cobrados. Los asistentes</text><text x="124" y="496" font-family="Roboto" font-size="12.5" font-weight="400" fill="#1F3A5F" text-anchor="start">reciben el 100 % de reembolso;</text><text x="124" y="513" font-family="Roboto" font-size="12.5" font-weight="400" fill="#1F3A5F" text-anchor="start">la comisión se carga a tu</text><text x="124" y="530" font-family="Roboto" font-size="12.5" font-weight="400" fill="#1F3A5F" text-anchor="start">cuenta de organizador.</text><text x="84" y="566" font-family="Roboto" font-size="12" font-weight="400" fill="#5D6D7E" text-anchor="start">Esta acción no se puede deshacer. Se</text><text x="84" y="582" font-family="Roboto" font-size="12" font-weight="400" fill="#5D6D7E" text-anchor="start">avisará a los asistentes.</text><g id="Botón · Cancelar y aceptar comisión"><rect x="122" y="614" width="206" height="40" rx="20.0" fill="#D64E2A"/><text x="225.0" y="639.0" font-family="Roboto" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Cancelar y aceptar comisión</text></g><text x="328" y="682" font-family="Roboto" font-size="13.5" font-weight="500" fill="#1F3A5F" text-anchor="end">Conservar evento</text></g></svg>